name: Cleanup GHCR versions

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete the listed package versions instead of dry-running."
        required: true
        default: false
        type: boolean
      keep_releases:
        description: "Number of full semver release versions to keep."
        required: true
        default: "2"
        type: choice
        options:
          - "2"

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Cleanup old GHCR package versions
    runs-on: ubuntu-latest

    steps:
      - name: Calculate deletion candidates
        id: candidates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
        run: |
          set -euo pipefail

          gh api --paginate --slurp \
            "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            > versions-pages.json

          node <<'NODE'
          const fs = require("fs");

          const pages = JSON.parse(fs.readFileSync("versions-pages.json", "utf8"));
          const versions = pages.flat();
          const keepReleaseCount = Number.parseInt(process.env.KEEP_RELEASES, 10);
          const semverPattern = /^(\d+)\.(\d+)\.(\d+)$/;

          function tagsOf(version) {
            return version.metadata?.container?.tags ?? [];
          }

          function parseSemver(tag) {
            const match = semverPattern.exec(tag);
            return match
              ? {
                  tag,
                  major: Number.parseInt(match[1], 10),
                  minor: Number.parseInt(match[2], 10),
                  patch: Number.parseInt(match[3], 10),
                }
              : null;
          }

          function compareSemverDesc(left, right) {
            return right.major - left.major
              || right.minor - left.minor
              || right.patch - left.patch;
          }

          const releases = versions
            .map(version => {
              const releaseTags = tagsOf(version).map(parseSemver).filter(Boolean);
              releaseTags.sort(compareSemverDesc);
              return releaseTags.length > 0 ? { version, release: releaseTags[0] } : null;
            })
            .filter(Boolean)
            .sort((left, right) => compareSemverDesc(left.release, right.release));

          const keptReleaseIds = new Set(
            releases.slice(0, keepReleaseCount).map(entry => entry.version.id),
          );

          const candidates = versions.filter(version => {
            const tags = tagsOf(version);
            if (tags.includes("latest")) {
              return false;
            }

            return tags.length === 0 || !keptReleaseIds.has(version.id);
          });

          const summary = [
            "## GHCR cleanup dry-run",
            "",
            `Package: ${process.env.OWNER}/${process.env.PACKAGE_NAME}`,
            `Keeping full semver releases: ${keepReleaseCount}`,
            "",
            "### Kept releases",
            "",
            ...releases.slice(0, keepReleaseCount).map(entry => (
              `- ${entry.release.tag}: version ${entry.version.id}, digest ${entry.version.name}`
            )),
            "",
            "### Deletion candidates",
            "",
            ...(candidates.length === 0
              ? ["- None."]
              : candidates.map(version => {
                  const tags = tagsOf(version);
                  return `- version ${version.id}, tags: ${tags.length === 0 ? "(untagged)" : tags.join(", ")}, digest ${version.name}`;
                })),
            "",
          ].join("\n");

          fs.writeFileSync("cleanup-candidates.md", summary);
          fs.writeFileSync("cleanup-candidates.json", JSON.stringify(
            candidates.map(version => ({ id: version.id, tags: tagsOf(version), digest: version.name })),
            null,
            2,
          ));
          NODE

          cat cleanup-candidates.md >> "$GITHUB_STEP_SUMMARY"
          count="$(node -e "console.log(require('./cleanup-candidates.json').length)")"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Delete candidates
        if: ${{ inputs.apply == true && steps.candidates.outputs.count != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          node -e "for (const candidate of require('./cleanup-candidates.json')) console.log(candidate.id)" |
          while read -r version_id; do
            echo "Deleting package version ${version_id}."
            gh api --method DELETE \
              "/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}"
          done

      - name: Report dry-run
        if: ${{ inputs.apply != true }}
        run: echo "Dry-run only. Re-run this workflow with apply=true to delete the listed package versions."
