name: Publish container

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Raider.slnx

      - name: Check release version
        shell: bash
        run: |
          project_version="$(dotnet msbuild src/Raider.Web/Raider.Web.csproj -getProperty:Version)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$project_version" = "$tag_version" || {
            echo "Tag $tag_version does not match project version $project_version."
            exit 1
          }

      - name: Build
        run: dotnet build Raider.slnx --no-restore -warnaserror

      - name: Install Playwright Chromium
        run: pwsh tests/Raider.Web.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test Raider.slnx --no-restore --no-build

      - name: Check formatting
        run: dotnet format Raider.slnx --verify-no-changes --no-restore

  publish:
    name: Publish GHCR image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
