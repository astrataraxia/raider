services:
  raider:
    container_name: raider-app
    image: ${RAIDER_IMAGE:-raider:local}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${RAIDER_BIND_ADDRESS:-127.0.0.1}:${RAIDER_PORT:-8080}:8080"
    environment:
      RAIDER__CHZZK__CLIENTID: ${RAIDER__CHZZK__CLIENTID}
      RAIDER__CHZZK__CLIENTSECRET: ${RAIDER__CHZZK__CLIENTSECRET}
      RAIDER__FAVORITES__DATABASEPATH: /data/raider.db
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - "${RAIDER_DATA_PATH:-./data}:/data"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
