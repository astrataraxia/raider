services:
  raider-data-init:
    image: ${RAIDER_IMAGE:-raider:local}
    pull_policy: always
    user: root
    entrypoint: ["bash", "-c", "mkdir -p /data/dp-keys; chown app:app /data /data/dp-keys; [ ! -e /data/raider.db ] || chown app:app /data/raider.db; exit 0"]
    volumes:
      - "${RAIDER_DATA_PATH:-./data}:/data"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    cpus: 0.25
    mem_limit: 32m

  raider:
    container_name: raider-app
    image: ${RAIDER_IMAGE:-raider:local}
    restart: unless-stopped
    pull_policy: always
    depends_on:
      raider-data-init:
        condition: service_completed_successfully
    ports:
      - "${RAIDER_BIND_ADDRESS:-127.0.0.1}:${RAIDER_PORT:-8080}:8080"
    environment:
      RAIDER__CHZZK__CLIENTID: ${RAIDER__CHZZK__CLIENTID}
      RAIDER__CHZZK__CLIENTSECRET: ${RAIDER__CHZZK__CLIENTSECRET}
      RAIDER__CHZZK__REDIRECTURI: ${RAIDER__CHZZK__REDIRECTURI:-}
      RAIDER__SOOP__CLIENTID: ${RAIDER__SOOP__CLIENTID}
      RAIDER__FAVORITES__DATABASEPATH: /data/raider.db
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_SYSTEM_NET_DISABLEIPV6: "1"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - "${RAIDER_DATA_PATH:-./data}:/data"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 128
    cpus: 1.0
    mem_limit: 256m
