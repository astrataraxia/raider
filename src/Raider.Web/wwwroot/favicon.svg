<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Outer circle matching --color-brand (#8B7CFF) -->
  <circle cx="16" cy="16" r="11" stroke="#8B7CFF" stroke-width="2" />
  <!-- Inner dot -->
  <circle cx="16" cy="16" r="2.5" fill="#8B7CFF" />
  <!-- Shadow/glow circle outer -->
  <circle cx="16" cy="16" r="14" stroke="#8B7CFF" stroke-width="2" stroke-opacity="0.07" />
  <!-- Arc rotated 42 degrees -->
  <circle cx="16" cy="16" r="8" stroke="#A397FF" stroke-width="1" stroke-dasharray="12 38" transform="rotate(42 16 16)" />
</svg>
